<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <title>Lista de invitados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1e63d6;
      --deep: #0d3f9e;
      --sky: #7cc8ff;
      --red: #e8312f;
      --red-dark: #a31f1d;
      --white: #ffffff;
      --ink: #12306b;
      --display: "Luckiest Guy", "Trebuchet MS", system-ui, sans-serif;
      --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--body);
      color: var(--ink);
      background: #d9f1ff;
      min-height: 100vh;
    }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-family: var(--display); font-weight: normal; letter-spacing: 1px; color: var(--deep); font-size: 2rem; margin: 0 0 16px; text-align: center; }
    .card {
      background: var(--white);
      border: 4px solid var(--blue);
      border-radius: 24px;
      padding: 20px;
      margin: 0 0 20px;
      box-shadow: 0 6px 0 rgba(18, 48, 107, 0.18);
    }
    .card[hidden], [hidden] { display: none !important; }
    label { display: grid; gap: 6px; font-weight: 700; color: var(--blue); }
    input {
      font: inherit;
      font-weight: 600;
      color: var(--ink);
      background: #eef7ff;
      border: 3px solid var(--sky);
      border-radius: 14px;
      padding: 10px 14px;
      width: 100%;
      min-width: 0;
    }
    input:focus { outline: none; border-color: var(--blue); background: var(--white); }
    .btn {
      font-family: var(--display);
      letter-spacing: 1px;
      font-size: 1.1rem;
      color: var(--white);
      background: var(--blue);
      border: 0;
      border-bottom: 5px solid var(--deep);
      border-radius: 999px;
      padding: 10px 24px 7px;
      cursor: pointer;
    }
    .btn.quiet { background: #8aa3c9; border-bottom-color: #5f7aa3; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    form { display: grid; gap: 14px; }
    form .btn { justify-self: start; }
    .msg { margin: 0; font-weight: 700; min-height: 1.5em; }
    .msg.error { color: var(--red-dark); }
    .totals { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; text-align: center; }
    .total { flex: 1 1 120px; background: #eef7ff; border-radius: 18px; padding: 12px; }
    .total.big { flex-basis: 100%; background: var(--blue); color: var(--white); }
    .total.big b { color: var(--white); font-size: 3.2rem; }
    .breakdown { text-align: center; margin: 12px 0 0; }
    .breakdown.warn { color: var(--red-dark); font-weight: 700; }
    .count { font-weight: 700; color: var(--blue); }
    .total b { display: block; font-family: var(--display); font-weight: normal; font-size: 2.4rem; color: var(--blue); line-height: 1; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0 0; }
    .toolbar input { flex: 1 1 200px; width: auto; }
    ol { list-style: none; margin: 0; padding: 0; }
    li { padding: 12px 0; border-top: 2px dashed var(--sky); display: grid; gap: 2px; }
    li:first-child { border-top: 0; }
    .name { font-weight: 800; font-size: 1.2rem; }
    .with, .when { font-size: 0.95rem; }
    .when { color: #5f7aa3; }
    .dup { color: var(--red-dark); font-weight: 700; font-size: 0.9rem; }
    .empty { text-align: center; margin: 12px 0; }
    .who { text-align: center; font-size: 0.95rem; margin: 0 0 16px; }
    .who button { font: inherit; background: none; border: 0; color: var(--blue); text-decoration: underline; cursor: pointer; padding: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Lista de invitados 🐾</h1>

    <section id="login" class="card" hidden>
      <form id="login-form">
        <label>
          Tu correo
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <button class="btn" type="submit">Mandarme el enlace</button>
        <p id="login-msg" class="msg" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="list-view" hidden>
      <p class="who">Entraste como <span id="who"></span> · <button id="logout" type="button">Salir</button></p>
      <div class="card">
        <div class="totals">
          <div class="total big"><b id="count-people">0</b>personas en total</div>
          <div class="total"><b id="count-friends">0</b>amig@s de Oliver</div>
          <div class="total"><b id="count-adults">0</b>adultos</div>
          <div class="total"><b id="count-siblings">0</b>hermanitos</div>
        </div>
        <p class="breakdown"><span id="count-rows">0</span> confirmaciones recibidas</p>
        <p id="missing" class="breakdown warn" hidden></p>
        <div class="toolbar">
          <input id="search" type="search" placeholder="Buscar nombre…" aria-label="Buscar nombre">
          <button id="refresh" class="btn quiet" type="button">Actualizar</button>
        </div>
      </div>
      <div class="card">
        <p id="list-msg" class="msg" role="status" aria-live="polite"></p>
        <ol id="rsvps"></ol>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="lista.js?v=3"></script>
</body>
</html>
